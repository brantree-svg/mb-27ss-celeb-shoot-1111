<!doctype html>
<!-- MB 27SS v76 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MB 27SS 셀럽 화보 촬영 전략</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#000000;--fg:#F2F0E9;--mute:#9A978F;--line:rgba(242,240,233,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Pretendard,system-ui,sans-serif;letter-spacing:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
#deck{position:fixed;inset:0 0 44px 0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:16px}
.slide img{max-width:100%;max-height:100%;aspect-ratio:16/9;width:auto;height:auto;object-fit:contain;background:#000;cursor:zoom-in;display:block}
body.fs #deck{bottom:0}
body.fs .slide{padding:0}
body.fs #bar{opacity:0;pointer-events:none}
body.fs.ui #bar{opacity:1;pointer-events:auto}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:13px;background:var(--bg);border-top:1px solid var(--line);transition:opacity .2s}
#bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
#bar .n{font-variant-numeric:tabular-nums}
#bar .n b{font-weight:600;color:var(--fg)}
#bar button{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);height:28px;padding:0 12px;cursor:pointer}
#bar button:hover{border-color:var(--fg)}
#prog{position:fixed;left:0;bottom:44px;height:2px;background:var(--fg);transition:width .25s}
body.fs #prog{bottom:0}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:96px;border:0;background:none;color:var(--fg);font-size:28px;opacity:.35;cursor:pointer;z-index:2}
.nav:hover{opacity:1}
#prev{left:0}#next{right:0}
@media (hover:none){.nav{display:none}}
#intro,#zoom,#rotate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(17,17,17,.94)}
#intro .box{max-width:420px;padding:32px 24px;text-align:left}
#intro h1{font-size:24px;font-weight:400;margin-bottom:8px}
#intro p{font-size:13px;color:var(--mute);line-height:1.6;margin-bottom:24px}
#intro .btns{display:flex;gap:8px;flex-wrap:wrap}
#intro button{font:inherit;font-size:14px;height:44px;padding:0 20px;cursor:pointer;border:1px solid var(--fg)}
#intro .p{background:var(--fg);color:#111}
#intro .s{background:none;color:var(--fg)}
#zoom{display:none;overflow:auto;align-items:flex-start;justify-content:flex-start;cursor:zoom-out;background:#111}
#zoom img{display:block;width:1920px;max-width:none;margin:auto}
#zoom .x{position:fixed;top:12px;right:12px;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:rgba(17,17,17,.8)}
#rotate{display:none;font-size:14px;color:var(--fg);text-align:center;padding:24px;line-height:1.6;background:rgba(17,17,17,.9)}
</style>
</head>
<body>
<div id="deck"></div>
<button class="nav" id="prev" aria-label="이전 장">‹</button>
<button class="nav" id="next" aria-label="다음 장">›</button>
<div id="prog"></div>
<div id="bar">
  <span class="n"><b id="cur">01</b> / <span id="tot">11</span></span>
  <span class="t" id="ttl"></span>
  <button id="fsb">⛶ 크게 보기</button>
</div>
<div id="intro"><div class="box">
  <h1>MB 27SS 셀럽 화보 촬영 전략</h1>
  <p>김지용 상무님 보고 · v76 · 11장<br>좌우 스와이프 · 방향키 · 휠 · 좌우 버튼으로 넘김<br>슬라이드 클릭 시 원본 크기 확대 · 내부 보고용</p>
  <div class="btns"><button class="p" id="goFs">전체화면으로 보기</button><button class="s" id="goIn">이대로 보기</button></div>
</div></div>
<div id="zoom"><span class="x">닫기</span><img alt=""></div>
<div id="rotate">가로로 돌려 보면 슬라이드가 크게 보입니다<br><span style="color:var(--mute);font-size:13px">화면을 눌러 닫기</span></div>
<script>
const T=['표지','ISSUE · 현황과 과제','STRATEGY · 촬영 전략','VISUAL LAYER · 노출 구조','BRIDGE POINT · 시즌 톤앤무드','CONTENT TREE · 남성 촬영 구성','CONTENT TREE · 여성 촬영 구성','CUT MATRIX · 컷별 매체 활용','CUT REFERENCE · 컷별 촬영 가이드','SHOOT LANE · 촬영 역할 분담','ROADMAP · 콘텐츠 공개 일정'];
const N=T.length,pad=n=>String(n).padStart(2,'0');
const deck=document.getElementById('deck'),imgs=[];
T.forEach((t,k)=>{const s=document.createElement('section');s.className='slide';s.id='s'+(k+1);
  const i=document.createElement('img');i.alt=t;i.width=1920;i.height=1080;i.dataset.src='s'+pad(k+1)+'.jpg';
  i.onclick=()=>openZoom(k);s.appendChild(i);deck.appendChild(s);imgs.push(i);});
document.getElementById('tot').textContent=pad(N);
let cur=0;
function load(k){for(let j=k-2;j<=k+2;j++){const i=imgs[j];if(i&&!i.src)i.src=i.dataset.src;}}
function show(k){cur=k;document.getElementById('cur').textContent=pad(k+1);document.getElementById('ttl').textContent=T[k];
  document.getElementById('prog').style.width=((k+1)/N*100)+'%';load(k);history.replaceState(null,'','#'+(k+1));}
function go(k,smooth=true){k=Math.max(0,Math.min(N-1,k));deck.scrollTo({left:k*deck.clientWidth,behavior:smooth?'smooth':'auto'});show(k);}
let st;deck.addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{const k=Math.round(deck.scrollLeft/deck.clientWidth);if(k!==cur)show(k);},60);});
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(zoom.style.display==='flex'){if(e.key==='Escape')closeZoom();else if(e.key==='ArrowRight')openZoom(Math.min(N-1,zk+1));else if(e.key==='ArrowLeft')openZoom(Math.max(0,zk-1));return;}
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(N-1);else if(e.key==='f')toggleFs();});
let wl=0;deck.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();const now=Date.now();if(now-wl<500||Math.abs(e.deltaY)<8)return;wl=now;go(cur+(e.deltaY>0?1:-1));},{passive:false});
window.addEventListener('resize',()=>go(cur,false));
window.addEventListener('hashchange',()=>{const k=parseInt(location.hash.slice(1))-1;if(k>=0&&k<N&&k!==cur)go(k);});
// fullscreen
const fsb=document.getElementById('fsb'),de=document.documentElement;
const canFs=!!(de.requestFullscreen||de.webkitRequestFullscreen);
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFs(){if(!canFs){document.body.classList.toggle('fs');sync();rotateHint();return;}
  if(isFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(de.requestFullscreen||de.webkitRequestFullscreen).call(de);}
function sync(){const on=isFs()||(!canFs&&document.body.classList.contains('fs'));document.body.classList.toggle('fs',on);fsb.textContent=on?'원래대로':'⛶ 크게 보기';setTimeout(()=>go(cur,false),80);}
document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);
fsb.onclick=toggleFs;
let ut;document.addEventListener('mousemove',()=>{if(!document.body.classList.contains('fs'))return;document.body.classList.add('ui');clearTimeout(ut);ut=setTimeout(()=>document.body.classList.remove('ui'),1800);});
// iPhone rotate hint
const rot=document.getElementById('rotate');
function rotateHint(){const touch=matchMedia('(hover:none)').matches,portrait=innerHeight>innerWidth;rot.style.display=(touch&&portrait)?'flex':'none';}
rot.onclick=()=>rot.style.display='none';
// intro
const intro=document.getElementById('intro');
document.getElementById('goFs').onclick=()=>{intro.remove();toggleFs();rotateHint();};
document.getElementById('goIn').onclick=()=>{intro.remove();rotateHint();};
// zoom
const zoom=document.getElementById('zoom'),zi=zoom.querySelector('img');let zk=0;
function openZoom(k){zk=k;zi.src=imgs[k].dataset.src;zi.alt=T[k];zoom.style.display='flex';zoom.scrollTo(0,0);}
function closeZoom(){zoom.style.display='none';}
zoom.onclick=closeZoom;
// start
const h=parseInt(location.hash.slice(1))-1;load(0);setTimeout(()=>go(h>=0&&h<N?h:0,false),0);
</script>
</body>
</html>
